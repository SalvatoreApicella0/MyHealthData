name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  desktop-package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm run ios:generate
      - name: Test iOS Catalyst
        run: >-
          xcodebuild test
          -project apps/ios/MyHealthDataiOS/MyHealthDataiOS.xcodeproj
          -scheme MyHealthDataiOS
          -destination 'platform=macOS,variant=Mac Catalyst'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - run: npm run hub:package:mac
